<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projeto Flexbox e Formas Geométricas</title>
  <!-- 1. Inclusão do CSS de forma externa -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Container principal configurado como Flex Container -->
  <main class="flex-container">
    
    <!-- 2. Criação dos 20 elementos com Formas Geométricas -->
    <div class="box card-01 shape-square"><span>ITEM 01</span></div>
    <div class="box card-02 shape-circle"><span>ITEM 02</span></div>
    <div class="box card-03 shape-triangle"><span>ITEM 03</span></div>
    <div class="box card-04 shape-diamond"><span>ITEM 04</span></div>
    <div class="box card-05 shape-pentagon"><span>ITEM 05</span></div>
    <div class="box card-06 shape-hexagon"><span>ITEM 06</span></div>
    <div class="box card-07 shape-star"><span>ITEM 07</span></div>
    <div class="box card-08 shape-rect"><span>ITEM 08</span></div>
    <div class="box card-09 shape-cross"><span>ITEM 09</span></div>
    <div class="box card-10 shape-octagon"><span>ITEM 10</span></div>
    <div class="box card-11 shape-square"><span>ITEM 11</span></div>
    <div class="box card-12 shape-triangle"><span>ITEM 12</span></div>
    <div class="box card-13 shape-circle"><span>ITEM 13</span></div>
    <div class="box card-14 shape-rect"><span>ITEM 14</span></div>
    <div class="box card-15 shape-diamond"><span>ITEM 15</span></div>
    <div class="box card-16 shape-star"><span>ITEM 16</span></div>
    <div class="box card-17 shape-heart"><span>ITEM 17</span></div>
    <div class="box card-18 shape-circle"><span>ITEM 18</span></div>
    <div class="box card-19 shape-square"><span>ITEM 19</span></div>
    <div class="box card-20 shape-hexagon"><span>ITEM 20</span></div>

  </main>

</body>
</html>
